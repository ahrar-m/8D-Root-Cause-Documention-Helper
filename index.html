<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8D Problem Solving Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; color-scheme: dark; }
        .section-card { transition: all 0.3s ease; }
        .section-card:focus-within { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .tab-active { background-color: #1e293b; color: #3b82f6; border-bottom: 2px solid #3b82f6; }
        @media print {
            .no-print { display: none; }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-100 mb-2">8D Problem Solving Helper</h1>
            <p class="text-slate-400">Systematic root cause analysis and corrective action documentation</p>
        </header>

        <div class="no-print sticky top-4 z-20 mb-8 flex flex-wrap gap-3 justify-center bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl shadow-sm border border-slate-800">
            <button onclick="exportPDF()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z"/></svg>
                Export PDF
            </button>
            <button onclick="exportJSON()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M4 0h8v16H4z"/></svg>
                Save Project (JSON)
            </button>
            <label class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 text-sm cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15C8 15 8 3 8 3s0 12 0 12z"/><path d="M4 11.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5z"/><path d="M11 12.5a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1 0-1h7a.5.5 0 0 1 .5.5z"/><path d="M13 8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-4z"/></svg>
                Import Project
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importJSON(event)">
            </label>
        </div>

        <div class="no-print mb-6">
            <div class="flex overflow-x-auto no-scrollbar border-b border-slate-800">
                <button onclick="showTab('overview')" id="tab-overview" class="px-6 py-3 text-sm font-medium transition-all whitespace-nowrap tab-active">Overview</button>
                <div id="tab-nav-container" class="flex"></div>
            </div>
        </div>

        <div id="pdf-content" class="space-y-6">
            <div class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Project Title</label>
                    <input type="text" id="projectTitle" placeholder="e.g., Component X Failure Analysis" class="w-full px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-lg">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">DATE CREATED</label>
                    <input type="date" id="projectDate" class="w-full px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div id="tabs-container">
                <div id="content-overview" class="tab-content space-y-6">
                    <div class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                        <h2 class="text-xl font-bold text-slate-100 mb-4">Problem Solving Overview</h2>
                        <div id="overview-summary" class="space-y-6"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sectionsData = [
            { id: 'D0', title: 'Preliminary Problem Statement', desc: '', fields: [{ id: 'preliminary-statement', label: 'Preliminary Problem Statement', type: 'textarea' }, { id: 'additional-details', label: 'Additional Details', type: 'textarea' }] },
            { id: 'D1', title: 'D1: Team Formation', desc: 'Assemble a cross-functional team with the right skills and authority.', special: 'team', fields: [{ id: 'additional-details', label: 'Additional Details', type: 'textarea' }] },
            { id: 'D2', title: 'D2: Problem Description', desc: 'Define the problem using the 5W2H method (Who, What, Where, When, Why, How, How Many).', fields: [{ id: 'additional-details', label: 'Additional Details', type: 'textarea' }] },
            { id: 'D3', title: 'D3: Interim Containment Actions', desc: 'Implement temporary actions to isolate the problem and protect the customer.', fields: [{ id: 'additional-details', label: 'Additional Details', type: 'textarea' }] },
            { id: 'D4', title: 'D4: Root Cause Analysis & Escape Points', desc: 'Identify the root cause and why it was not detected (Escape Point).', special: 'dynamic', fields: [{ id: 'additional-details', label: 'Additional Details', type: 'textarea' }] },
            { id: 'D5', title: 'D5: Choose & Verify Permanent Corrective Actions', desc: 'Determine and verify the best permanent solution to eliminate the root cause.', fields: [{ id: 'additional-details', label: 'Additional Details', type: 'textarea' }] },
            { id: 'D6', title: 'D6: Implement & Validate Permanent Corrective Actions', desc: 'Deploy the solution and monitor the results to ensure it works.', fields: [{ id: 'additional-details', label: 'Additional Details', type: 'textarea' }] },
            { id: 'D7', title: 'D7: Prevent Recurrence', desc: 'Update systems, standards, and procedures to prevent the problem from happening again.', fields: [{ id: 'additional-details', label: 'Additional Details', type: 'textarea' }] },
            { id: 'D8', title: 'D8: Team & Individual Recognition', desc: 'Document lessons learned and recognize the team’s efforts.', fields: [{ id: 'additional-details', label: 'Additional Details', type: 'textarea' }] }
        ];

        function init() {
            const navContainer = document.getElementById('tab-nav-container');
            const contentContainer = document.getElementById('tabs-container');

            sectionsData.forEach(s => {
                const tabBtn = document.createElement('button');
                tabBtn.id = `tab-${s.id}`;
                tabBtn.className = 'px-6 py-3 text-sm font-medium transition-all whitespace-nowrap text-slate-400 hover:text-slate-200';
                tabBtn.innerText = s.id;
                tabBtn.onclick = () => showTab(s.id);
                navContainer.appendChild(tabBtn);

                const tabDiv = document.createElement('div');
                tabDiv.id = `content-${s.id}`;
                tabDiv.className = 'tab-content hidden space-y-6';
                
                let specialContent = '';
                if (s.special === 'dynamic') {
                    specialContent = `
                        <div class="mt-6 space-y-6">
                            <div>
                                <label class="block text-sm font-semibold text-slate-300 mb-2 flex items-center justify-between">
                                    Hypotheses
                                    <button onclick="addItem('hypotheses-${s.id}')" class="text-blue-400 hover:text-blue-300 text-xs font-bold uppercase">+ Add Hypothesis</button>
                                </label>
                                <div id="hypotheses-${s.id}" class="space-y-2"></div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-300 mb-2 flex items-center justify-between">
                                    Research Questions
                                    <button onclick="addItem('research-${s.id}')" class="text-blue-400 hover:text-blue-300 text-xs font-bold uppercase">+ Add Question</button>
                                </label>
                                <div id="research-${s.id}" class="space-y-2"></div>
                            </div>
                        </div>
                    `;
                } else if (s.special === 'team') {
                    specialContent = `
                        <div class="mt-6 space-y-6">
                            <div>
                                <label class="block text-sm font-semibold text-slate-300 mb-2 flex items-center justify-between">
                                    Team Members
                                    <button onclick="addTeamMember('${s.id}')" class="text-blue-400 hover:text-blue-300 text-xs font-bold uppercase">+ Add Member</button>
                                </label>
                                <div id="team-${s.id}" class="space-y-2"></div>
                            </div>
                        </div>
                    `;
                }

                tabDiv.innerHTML = `
                    <div class="section-card bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                        <div class="mb-4">
                            <h2 class="text-xl font-bold text-slate-100">${s.title}</h2>
                            <p class="text-sm text-slate-400">${s.desc}</p>
                        </div>
                        ${specialContent ? `<div class="mb-6">${specialContent}</div>` : ''}
                        <div class="space-y-4">
                            ${s.fields.map(f => `
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">${f.label}</label>
                                    ${f.type === 'textarea' ? 
                                        `<textarea id="${s.id}-${f.id}" rows="3" class="w-full px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-y" placeholder="Enter details..." oninput="updateOverview()"></textarea>` : 
                                        `<input type="text" id="${s.id}-${f.id}" class="w-full px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter details..." oninput="updateOverview()">`
                                    }
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                contentContainer.appendChild(tabDiv);
            });
            
            showTab('overview');
            updateOverview();
        }

        function showTab(tabId) {
            document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.classList.remove('tab-active', 'text-slate-100'));
            document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.classList.add('text-slate-400'));
            
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.add('tab-active', 'text-slate-100');
                activeBtn.classList.remove('text-slate-400');
            }

            document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
            const targetContent = document.getElementById(`content-${tabId}`);
            if (targetContent) targetContent.classList.remove('hidden');

            const titleInput = document.getElementById('projectTitle');
            const dateInput = document.getElementById('projectDate');
            const isOverview = (tabId === 'overview');

            titleInput.readOnly = !isOverview;
            dateInput.readOnly = !isOverview;

            if (isOverview) {
                titleInput.classList.remove('bg-transparent', 'border-transparent', 'cursor-default');
                titleInput.classList.add('bg-slate-800', 'border-slate-700');
                dateInput.classList.remove('bg-transparent', 'border-transparent', 'cursor-default');
                dateInput.classList.add('bg-slate-800', 'border-slate-700');
            } else {
                titleInput.classList.add('bg-transparent', 'border-transparent', 'cursor-default');
                titleInput.classList.remove('bg-slate-800', 'border-slate-700');
                dateInput.classList.add('bg-transparent', 'border-transparent', 'cursor-default');
                dateInput.classList.remove('bg-slate-800', 'border-slate-700');
            }

            if (tabId === 'overview') updateOverview();
        }

        function updateOverview() {
            const summary = document.getElementById('overview-summary');
            summary.innerHTML = '';

            sectionsData.forEach(s => {
                let contentHtml = '';
                
                if (s.special === 'team') {
                    const members = Array.from(document.querySelectorAll(`#team-${s.id} div`)).map(div => {
                        const inputs = div.querySelectorAll('input');
                        return { name: inputs[0].value, role: inputs[1].value };
                    }).filter(m => m.name || m.role);

                    if (members.length) {
                        contentHtml += `
                            <div class="mb-3">
                                <span class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Team Members</span>
                                <div class="grid grid-cols-1 gap-1">
                                    ${members.map(m => `<div class="text-sm text-slate-200">${m.name}${m.role ? ` <span class="text-slate-400 italic text-xs">(${m.role})</span>` : ''}</div>`).join('')}
                                </div>
                            </div>
                        `;
                    }
                }

                if (s.special === 'dynamic') {
                    const hyps = Array.from(document.querySelectorAll(`#hypotheses-${s.id} input`)).map(i => i.value).filter(v => v);
                    const res = Array.from(document.querySelectorAll(`#research-${s.id} input`)).map(i => i.value).filter(v => v);
                    
                    if (hyps.length || res.length) {
                        contentHtml += `
                            <div class="mt-3 space-y-3 p-2 bg-slate-800/50 rounded-lg border border-slate-700/50">
                                ${hyps.length ? `
                                    <div>
                                        <span class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Hypotheses</span>
                                        <ul class="list-disc list-inside text-xs text-slate-300 space-y-1">
                                            ${hyps.map(h => `<li>${h}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                                ${res.length ? `
                                    <div>
                                        <span class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Research Questions</span>
                                        <ul class="list-disc list-inside text-xs text-slate-300 space-y-1">
                                            ${res.map(r => `<li>${r}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }
                }

                if (s.fields && s.fields.length > 0) {
                    s.fields.forEach(f => {
                        const val = document.getElementById(`${s.id}-${f.id}`)?.value || '';
                        if (val) {
                            contentHtml += `
                                <div class="mb-3">
                                    <span class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">${f.label}</span>
                                    <p class="text-slate-200 text-sm leading-relaxed">${val}</p>
                                </div>
                            `;
                        }
                    });
                }

                if (contentHtml) {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'bg-slate-900/50 p-4 rounded-xl border border-slate-800 transition-all hover:border-slate-700';
                    sectionDiv.innerHTML = `
                        <div class="flex items-center gap-2 mb-3 border-b border-slate-800 pb-2">
                            <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">${s.id}</span>
                            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">${s.title}</h3>
                        </div>
                        <div class="space-y-2">
                            ${contentHtml}
                        </div>
                    `;
                    summary.appendChild(sectionDiv);
                }
            });

            if (summary.innerHTML === '') {
                summary.innerHTML = `
                    <div class="text-center py-12">
                        <svg class="mx-auto h-12 w-12 text-slate-700 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <p class="text-slate-500 italic">Start filling out the 8D tabs to generate the overview report.</p>
                    </div>
                `;
            }
        }
        function addItem(containerId) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-start group';
            div.innerHTML = `
                <input type="text" class="flex-1 px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Enter detail..." oninput="updateOverview()">
                <button onclick="this.parentElement.remove(); updateOverview();" class="p-2 text-slate-500 hover:text-red-400 transition opacity-0 group-hover:opacity-100 font-bold">✕</button>
            `;
            container.appendChild(div);
        }

        function addTeamMember(sectionId) {
            const container = document.getElementById(`team-${sectionId}`);
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-start group';
            div.innerHTML = `
                <input type="text" class="flex-1 px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Name" oninput="updateOverview()">
                <input type="text" class="flex-1 px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Role" oninput="updateOverview()">
                <button onclick="this.parentElement.remove(); updateOverview();" class="p-2 text-slate-500 hover:text-red-400 transition opacity-0 group-hover:opacity-100 font-bold">✕</button>
            `;
            container.appendChild(div);
        }

        async function exportPDF() {
            const opt = {
                margin: [10, 10, 10, 10],
                filename: `${document.getElementById('projectTitle').value || '8D-Report'}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            const clone = document.createElement('div');
            clone.className = 'p-8 bg-white text-slate-900 space-y-8';
            const projectInfo = document.getElementById('pdf-content').firstElementChild.cloneNode(true);
            projectInfo.className = 'bg-slate-50 p-6 rounded-2xl border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-4';
            projectInfo.querySelectorAll('input').forEach(el => {
                const span = document.createElement('div');
                span.className = 'p-2 border-b border-slate-200 min-h-[2rem] text-slate-800 font-bold';
                span.innerText = el.value;
                el.replaceWith(span);
            });
            clone.appendChild(projectInfo);
            sectionsData.forEach(s => {
                const contentTab = document.getElementById(`content-${s.id}`);
                if (!contentTab) return;
                const sectionEl = contentTab.querySelector('.section-card').cloneNode(true);
                sectionEl.className = 'bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-6';
                sectionEl.querySelectorAll('textarea, input').forEach(el => {
                    const span = document.createElement('div');
                    span.className = 'p-2 border-b border-slate-100 min-h-[2rem] text-slate-800';
                    span.innerText = el.value;
                    el.replaceWith(span);
                });
                clone.appendChild(sectionEl);
            });
            await html2pdf().set(opt).from(clone).save();
        }

        function exportJSON() {
            const data = {
                projectTitle: document.getElementById('projectTitle').value,
                projectDate: document.getElementById('projectDate').value,
                sections: {}
            };
            sectionsData.forEach(s => {
                let sectionData = {};
                s.fields.forEach(f => {
                    sectionData[f.id] = document.getElementById(`${s.id}-${f.id}`)?.value || '';
                });
                if (s.special === 'team') {
                    sectionData.team = Array.from(document.querySelectorAll(`#team-${s.id} div`)).map(div => {
                        const inputs = div.querySelectorAll('input');
                        return { name: inputs[0].value, role: inputs[1].value };
                    });
                }
                if (s.special === 'dynamic') {
                    sectionData.hypotheses = Array.from(document.querySelectorAll(`#hypotheses-${s.id} input`)).map(i => i.value);
                    sectionData.research = Array.from(document.querySelectorAll(`#research-${s.id} input`)).map(i => i.value);
                }
                data.sections[s.id] = sectionData;
            });
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${data.projectTitle || '8D-Project'}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = JSON.parse(e.target.result);
                document.getElementById('projectTitle').value = data.projectTitle || '';
                document.getElementById('projectDate').value = data.projectDate || '';
                sectionsData.forEach(s => {
                    const sectionData = data.sections[s.id] || {};
                    s.fields.forEach(f => {
                        const el = document.getElementById(`${s.id}-${f.id}`);
                        if (el) el.value = sectionData[f.id] || '';
                    });
                    if (s.special === 'dynamic') {
                        const hypContainer = document.getElementById(`hypotheses-${s.id}`);
                        const resContainer = document.getElementById(`research-${s.id}`);
                        hypContainer.innerHTML = ''; resContainer.innerHTML = '';
                        (sectionData.hypotheses || []).forEach(val => {
                            const div = document.createElement('div');
                            div.className = 'flex gap-2 items-start group';
                            div.innerHTML = `<input type="text" value="${val}" class="flex-1 px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" oninput="updateOverview()"><button onclick="this.parentElement.remove(); updateOverview();" class="p-2 text-slate-500 hover:text-red-400 transition opacity-0 group-hover:opacity-100 font-bold">✕</button>`;
                            hypContainer.appendChild(div);
                        });
                        (sectionData.research || []).forEach(val => {
                            const div = document.createElement('div');
                            div.className = 'flex gap-2 items-start group';
                            div.innerHTML = `<input type="text" value="${val}" class="flex-1 px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" oninput="updateOverview()"><button onclick="this.parentElement.remove(); updateOverview();" class="p-2 text-slate-500 hover:text-red-400 transition opacity-0 group-hover:opacity-100 font-bold">✕</button>`;
                            resContainer.appendChild(div);
                        });
                    }
                    if (s.special === 'team') {
                        const teamContainer = document.getElementById(`team-${s.id}`);
                        teamContainer.innerHTML = '';
                        (sectionData.team || []).forEach(m => {
                            const div = document.createElement('div');
                            div.className = 'flex gap-2 items-start group';
                            div.innerHTML = `<input type="text" value="${m.name}" class="flex-1 px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" oninput="updateOverview()"><input type="text" value="${m.role}" class="flex-1 px-3 py-2 border border-slate-700 bg-slate-800 text-slate-100 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" oninput="updateOverview()"><button onclick="this.parentElement.remove(); updateOverview();" class="p-2 text-slate-500 hover:text-red-400 transition opacity-0 group-hover:opacity-100 font-bold">✕</button>`;
                            teamContainer.appendChild(div);
                        });
                    }
                });
                updateOverview();
            };
            reader.readAsText(file);
        }

        init();
    </script>
</body>
</html>
